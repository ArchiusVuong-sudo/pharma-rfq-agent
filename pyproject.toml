[project]
name = "pharma-rfq-agent"
version = "0.1.0"
description = "Quote-to-award agent for a pooled medicine RFQ, with a policy gate and human review"
authors = [{ name = "Khanh Vuong Tuan" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.14,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfq_agent"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls the real model (set LIVE=1)"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["rfq_agent"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]


[tool.ruff.lint.per-file-ignores]
# Prompt text and schema descriptions are part of the recorded fixtures' keys: keep them verbatim.
"src/rfq_agent/agent/extract.py" = ["E501"]
"src/rfq_agent/models.py" = ["E501"]
