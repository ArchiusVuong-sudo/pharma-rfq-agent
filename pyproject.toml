[project]
name = "pharma-rfq-agent"
version = "0.1.0"
description = "Quote-to-award agent for a pooled medicine RFQ, with a policy gate and human review"
authors = [{ name = "Khanh Vuong Tuan" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.165",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.14,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfq_agent"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
