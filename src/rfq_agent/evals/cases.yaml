# Labelled eval cases. Synthetic: invented suppliers, emails and numbers.
# Scored at the seed date (AS_OF). C01-C06 are the six demo emails; C07-C18 cover each policy rule.
# expected.fields are what the model must read from the email (null = must stay empty).
# expected.flags are check ids that must fire (recall). expected.route is the line decision.

- id: C01
  title: Pasted table, price per box of 100, USD FCA
  rule: none (act alone)
  email_id: E1
  product_id: P-ZINC-20-DT
  demands: [{buyer_id: B-UG-01, quantity: 60000}, {buyer_id: B-KE-01, quantity: 40000}, {buyer_id: B-MW-01, quantity: 30000}]
  expected:
    fields: {product_id: P-ZINC-20-DT, price_amount: 2.40, currency: USD, price_per_quantity: 100, incoterm: FCA, moq_units: 20000, max_units: 300000, lead_time_days: 30, shelf_life_months: 30, coa_provided: true}
    flags: []
    route: act_alone

